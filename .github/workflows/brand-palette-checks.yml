name: Brand palette verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/theme.ts'
      - 'tests/**'
      - '.github/workflows/brand-palette-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_fixture
      HERO_CATALOGUE_PORT: '4100'
      ACCOUNT_FIXTURE_PORT: '4100'
      HERO_WIDTHS: '390,1440'
      HERO_BROWSERS: chromium,webkit
      SHOP_HERO_WIDTHS: '390,1440'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Application and payment guards
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Palette, theme persistence and contrast
        run: npm run test:palette
      - name: Existing hero and connected pages
        run: npm run test:browser
      - name: Shop animation and links
        run: npm run test:shop-hero
      - name: Customer account and delivery states
        run: npm run test:account
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: brand-palette-browser-evidence
          path: |
            work/palette-review/
            work/hero-verification/
            work/shop-hero-review/
            work/account-verification/
          retention-days: 7
