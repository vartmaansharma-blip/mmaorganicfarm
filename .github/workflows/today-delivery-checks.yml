name: Today delivery verification

on:
  pull_request:
    paths:
      - "app/account/**"
      - "app/calendar/**"
      - "tests/account.browser.mjs"
      - ".github/workflows/today-delivery-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4100
      ACCOUNT_FIXTURE_PORT: "4100"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_fixture
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Application and payment guard tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Customer account browser acceptance
        run: npm run test:account
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-delivery-browser-evidence
          path: work/account-verification/
          if-no-files-found: ignore
          retention-days: 7
